# Numbra CI — iOS simulator on a GitHub-hosted macOS runner (free, no host, no
# tunnel). Builds the app once, then runs the .mob flows on a booted simulator,
# sharded across parallel runners. Nothing leaves the runner.
#
# Requires a runner image with the iOS 26 SDK/simulator (Numbra's deployment
# target is iOS 26.0). If GitHub's macOS image lacks Xcode 26, either pin it
# (maxim-lobanov/setup-xcode) or lower IPHONEOS_DEPLOYMENT_TARGET for CI.

name: iOS simulator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project + build (Debug, simulator)
        run: |
          xcodegen generate
          xcodebuild -project Numbra.xcodeproj -scheme Numbra \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath build build

      - name: Upload built .app
        uses: actions/upload-artifact@v4
        with:
          name: numbra-app
          path: build/Build/Products/Debug-iphonesimulator/Numbra.app

  test:
    needs: build
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2] # split flows round-robin across 2 runners
    steps:
      - uses: actions/checkout@v4 # for flows/

      # Install only. This branch measures the cold slim boot, so the action's
      # boot-sim (and the image cache behind it) is deliberately not used: the
      # next step boots with no --cache at all, which is the path a first run on
      # a fresh runner takes.
      - name: Install mobai-ci
        uses: MobAI-App/mobai-ci@main
        with:
          version: "0.6.0"

      # No --cache: create, slim while shut down, boot once already slim. The
      # timing is the point of this run, so it is printed and kept in the step
      # summary rather than buried in the log.
      - name: Boot a slim simulator with no cache
        run: |
          set -e
          start=$SECONDS
          udid=$(mobai-ci sim boot --slim ci/slim.json --startup-timeout 8m | tail -1)
          elapsed=$((SECONDS - start))
          echo "MOBAI_SIM_UDID=$udid" >> "$GITHUB_ENV"
          echo "shard ${{ matrix.shard }}: no-cache slim boot took ${elapsed}s (udid $udid)"
          echo "shard ${{ matrix.shard }}: no-cache slim boot **${elapsed}s**" >> "$GITHUB_STEP_SUMMARY"

      # Prove the simulator is really slim. status prints the numbers; verify
      # exits non-zero if the overrides drift from the profile, so a silent
      # fallback to a stock boot fails the job instead of passing quietly.
      - name: Check the simulator is actually slim
        run: |
          brew install mobai-app/tap/simslim
          simslim status "$MOBAI_SIM_UDID" | tee -a "$GITHUB_STEP_SUMMARY"
          simslim verify "$MOBAI_SIM_UDID" --profile ci/slim.json

      - name: Download built .app
        uses: actions/download-artifact@v4
        with:
          name: numbra-app
          path: app-build/Numbra.app

      # --live shows this run's simulator in the MobAI app while it runs, so you
      # can watch it. --hold-on-failure is left off on this branch on purpose:
      # nobody is watching an unattended timing run, so a red shard would just
      # hold a macOS runner open for ten idle minutes. Put it back for runs you
      # intend to inspect.
      - name: Run flows (shard ${{ matrix.shard }}/2)
        env:
          MOBAI_API_KEY: ${{ secrets.MOBAI_API_KEY }}
        run: |
          mobai-ci test ./flows \
            --app app-build/Numbra.app \
            --shard ${{ matrix.shard }}/2 \
            --device "$MOBAI_SIM_UDID" \
            --wait-device 4m --startup-timeout 5m \
            --live \
            --output reports

      - name: Upload reports
        if: always() # keep JUnit + failure screenshots/UI-trees even when red
        uses: actions/upload-artifact@v4
        with:
          name: reports-shard-${{ matrix.shard }}
          path: reports
