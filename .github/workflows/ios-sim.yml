# Numbra CI — iOS simulator on a GitHub-hosted macOS runner (free, no host, no
# tunnel). Builds the app once, then runs the .mob flows on a booted simulator,
# sharded across parallel runners. Nothing leaves the runner.
#
# Requires a runner image with the iOS 26 SDK/simulator (Numbra's deployment
# target is iOS 26.0). If GitHub's macOS image lacks Xcode 26, either pin it
# (maxim-lobanov/setup-xcode) or lower IPHONEOS_DEPLOYMENT_TARGET for CI.

name: iOS simulator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      timing:
        description: "Run only the boot timing experiment"
        default: "false"

jobs:
  build:
    if: inputs.timing != 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project + build (Debug, simulator)
        run: |
          xcodegen generate
          xcodebuild -project Numbra.xcodeproj -scheme Numbra \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath build build

      - name: Upload built .app
        uses: actions/upload-artifact@v4
        with:
          name: numbra-app
          path: build/Build/Products/Debug-iphonesimulator/Numbra.app

  test:
    needs: build
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2] # split flows round-robin across 2 runners
    steps:
      - uses: actions/checkout@v4 # for flows/

      # Installs mobai-ci and starts a simulator booting in the background
      # (cached, so later runs boot fast). Stays before other steps so the
      # boot overlaps the app download.
      - name: Install mobai-ci + boot simulator
        uses: MobAI-App/mobai-ci@v1
        with:
          version: "0.5.6"
          boot-sim: true # UDID lands in $MOBAI_SIM_UDID
          sim-slim: ci/slim.json # services the flows never touch stay off

      - name: Download built .app
        uses: actions/download-artifact@v4
        with:
          name: numbra-app
          path: app-build/Numbra.app

      # --live shows this run's simulator in the MobAI app while it runs, so you
      # can watch it. --hold-on-failure keeps it open afterwards if something
      # breaks, so the failure can be looked at on the device that produced it
      # instead of being reproduced locally. The window is idle time: it resets
      # while you are using the device, and the job stays running until it
      # closes or you release the device.
      - name: Run flows (shard ${{ matrix.shard }}/2)
        env:
          MOBAI_API_KEY: ${{ secrets.MOBAI_API_KEY }}
        run: |
          mobai-ci test ./flows \
            --app app-build/Numbra.app \
            --shard ${{ matrix.shard }}/2 \
            --device "$MOBAI_SIM_UDID" \
            --wait-device 4m --startup-timeout 5m \
            --live --hold-on-failure 10m \
            --output reports

      - name: Upload reports
        if: always() # keep JUnit + failure screenshots/UI-trees even when red
        uses: actions/upload-artifact@v4
        with:
          name: reports-shard-${{ matrix.shard }}
          path: reports

  # Manual experiment: how long does the cached slim simulator take to boot a
  # second time on the same runner, and does it still boot and run the flows
  # after dropping its regenerable caches?
  timing:
    if: inputs.timing == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Does the runner image already carry the per-host dyld cache for the
      # runtime, and how long does reading it take? Read it before the boot so
      # the first boot starts warm.
      - name: Runtime cache diagnostics + pre-read
        run: |
          RT=$(xcrun simctl list -j runtimes | python3 -c 'import json,sys;r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"]];r.sort(key=lambda x:[int(p) for p in x["version"].split(".")]);x=r[-1];print(x["identifier"]+"."+x["buildversion"])')
          echo "runtime: $RT"
          ls -la /Library/Developer/CoreSimulator/Caches/dyld/*/ 2>/dev/null | head -20
          D=$(ls -d /Library/Developer/CoreSimulator/Caches/dyld/*/$RT 2>/dev/null | head -1)
          echo "cache dir: ${D:-none}"
          if [ -n "$D" ]; then
            ls -la "$D"
            T0=$(date +%s); cat "$D"/dyld_sim_shared_cache_arm64* > /dev/null; echo "pre-read took $(( $(date +%s) - T0 ))s"
          fi
          echo "BOOT_T0=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install mobai-ci + boot simulator
        uses: MobAI-App/mobai-ci@v1
        with:
          version: "0.5.6"
          boot-sim: true
          sim-slim: ci/slim.json

      - name: First boot timing
        run: |
          T1=$(date +%s); xcrun simctl bootstatus "$MOBAI_SIM_UDID" -b >/dev/null; T2=$(date +%s)
          echo "1st boot: action+restore+boot returned after $(( T1 - BOOT_T0 ))s, Boot Finished after $(( T2 - BOOT_T0 ))s"
          echo "- 1st boot after pre-read: returned $(( T1 - BOOT_T0 ))s, Boot Finished $(( T2 - BOOT_T0 ))s" >> "$GITHUB_STEP_SUMMARY"
          ls -la /Library/Developer/CoreSimulator/Caches/dyld/*/ 2>/dev/null | head -20

      - name: Build app (Debug, simulator)
        run: |
          brew install xcodegen >/dev/null 2>&1
          xcodegen generate >/dev/null
          xcodebuild -project Numbra.xcodeproj -scheme Numbra -destination 'generic/platform=iOS Simulator' -configuration Debug -derivedDataPath build build -quiet
          echo "APP=$(find build/Build/Products -name 'Numbra.app' -type d | head -1)" >> "$GITHUB_ENV"

      - name: Timings
        run: |
          U="$MOBAI_SIM_UDID"; D="$HOME/Library/Developer/CoreSimulator/Devices/$U"
          t() { python3 -c 'import time;print(int(time.time()))'; }
          boot() { local t0=$(t); xcrun simctl boot "$U"; local t1=$(t); xcrun simctl bootstatus "$U" -b >/dev/null; echo "$(( t1 - t0 )) $(( $(t) - t0 ))"; }
          xcrun simctl bootstatus "$U" -b >/dev/null
          echo "device dir: $(du -sm "$D" | cut -f1) MB"
          echo "disabled: $(xcrun simctl spawn "$U" launchctl print-disabled system | grep -c '=> disabled')"
          xcrun simctl shutdown "$U"; sleep 3
          read -r c2 f2 <<< "$(boot)"; echo "2nd boot (warm page cache, full device): simctl boot ${c2}s, finished ${f2}s"
          xcrun simctl shutdown "$U"; sleep 3
          rm -rf "$D/data/private/var/MobileAsset" "$D/data/Library/Caches"
          echo "trimmed device dir: $(du -sm "$D" | cut -f1) MB"
          read -r c3 f3 <<< "$(boot)"; echo "3rd boot (trimmed device): simctl boot ${c3}s, finished ${f3}s"
          echo "disabled after trim: $(xcrun simctl spawn "$U" launchctl print-disabled system | grep -c '=> disabled')"
          {
            echo "### boot timing"
            echo "- 2nd boot, warm cache, full device: simctl boot ${c2}s, Boot Finished ${f2}s"
            echo "- 3rd boot, trimmed device: simctl boot ${c3}s, Boot Finished ${f3}s"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Flows on the trimmed device
        env:
          MOBAI_API_KEY: ${{ secrets.MOBAI_API_KEY }}
        run: |
          T0=$(date +%s)
          mobai-ci test ./flows --app "$APP" --device "$MOBAI_SIM_UDID" --wait-device 4m --startup-timeout 5m --output reports
          echo "- flows on trimmed device: $(( $(date +%s) - T0 ))s total" >> "$GITHUB_STEP_SUMMARY"
