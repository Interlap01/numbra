# How long a brand-new iOS simulator takes from boot to a passing test: stock
# versus with the home-screen widget services turned off before its first
# boot (mobai-ci sim boot --slim-only widgets). Each job creates its own
# simulator, so every run starts from zero.

name: Simulator boot benchmark

on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        variant: [stock, widgets]
        trial: [1, 2, 3]
    name: ${{ matrix.variant }} ${{ matrix.trial }}
    steps:
      - uses: actions/checkout@v4

      - name: Install mobai-ci
        uses: MobAI-App/mobai-ci@v1
        with:
          version: "0.7.4"

      - name: Boot and test, timed
        run: |
          now() { python3 -c 'import time; print(time.time())'; }
          SLIM=""
          [ "${{ matrix.variant }}" = widgets ] && SLIM="--slim-only widgets"
          t0=$(now)
          mobai-ci sim boot $SLIM
          t1=$(now)
          mobai-ci test bench-flows --wait-device 4m --output reports --timeout 15m
          t2=$(now)
          line=$(python3 -c "print(f'${{ matrix.variant }} trial=${{ matrix.trial }} simboot={$t1-$t0:.1f} runner+test={$t2-$t1:.1f} total={$t2-$t0:.1f}')")
          echo "RESULT $line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.variant }}-${{ matrix.trial }}
          path: reports
